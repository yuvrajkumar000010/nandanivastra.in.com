<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#321b0c">
<meta name="color-scheme" content="light dark">
<title>Nandini Vastra | Ready-made clothing</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7efe0;--surf:#fffaf0;--ink:#321b0c;--mute:#7a6550;--line:#e4d5b8;--acc:#381808;--acc-ink:#d8b068;--warn:#a8402a;--star:#b8863a;--thumb:#efe2c8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241108;--surf:#321b0c;--ink:#f3e7cf;--mute:#b9a283;--line:#4d3220;--acc:#d8b068;--acc-ink:#241108;--warn:#ec8c70;--star:#d8b068;--thumb:#3d2413}}
:root[data-theme="dark"]{--bg:#241108;--surf:#321b0c;--ink:#f3e7cf;--mute:#b9a283;--line:#4d3220;--acc:#d8b068;--acc-ink:#241108;--warn:#ec8c70;--star:#d8b068;--thumb:#3d2413}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Jost,"Segoe UI",Helvetica,Arial,sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:#321b0c;border-bottom:2px solid #d8b068}
.brand{display:flex;align-items:center;gap:10px;font:600 27px "Cormorant Garamond",Georgia,serif;letter-spacing:.1em}
.tabs{display:flex;gap:6px}
.tabs button{padding:8px 14px;border:1px solid var(--line);background:transparent;border-radius:8px}
.tabs button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
main{max-width:1050px;margin:0 auto;padding:20px}
.hero{padding:10px 0 18px}
.hero h1{font-size:clamp(26px,5vw,40px);max-width:20ch}
.hero p{color:var(--mute);max-width:56ch;margin:8px 0 0}
header .brand{color:#d8b068}
header .tabs button{color:#d8b068;border-color:#6b4a2a}
header .tabs button[aria-pressed="true"]{background:#d8b068;color:#321b0c;border-color:#d8b068}
.banner{background-color:#321b0c;background-image:radial-gradient(rgba(216,176,104,.14) 1px,transparent 1.5px);background-size:20px 20px;text-align:center;padding:30px 16px;border:1px solid #d8b068;outline:1px solid rgba(216,176,104,.4);outline-offset:-9px;margin-bottom:6px}
.banner img{width:min(280px,70%);height:auto;display:block;margin:0 auto 10px}
.banner h1{margin:0 auto;max-width:none;color:#d8b068;font-weight:500;font-size:clamp(30px,5vw,44px)}.banner h1::after{content:"";display:block;width:90px;height:1px;background:#d8b068;margin:12px auto 0}
.banner p{color:#e6d3a8;margin:12px auto 0;max-width:56ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0 4px}
.tile{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 10px;background:#321b0c;color:#d8b068;border:1px solid #6b4a2a;border-radius:2px;font:600 21px "Cormorant Garamond",Georgia,serif}
.tile span{font-size:26px}
.tile[aria-pressed="true"]{background:#d8b068;color:#321b0c;border-color:#d8b068}
.tile:hover,.card:hover{border-color:#d8b068}
.card h3{font-size:21px}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.bar input,.bar select,.f input,.f select,.f textarea{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surf);width:100%}
.bar input{flex:1 1 220px;width:auto}.bar select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:2px;padding:16px;display:flex;flex-direction:column;gap:6px;text-align:left}
.thumb{height:150px;border-radius:2px;display:grid;place-items:center;font-size:52px;box-shadow:inset 0 0 0 4px #d8b068,inset 0 0 0 7px rgba(36,17,8,.55);background-image:repeating-linear-gradient(45deg,rgba(216,176,104,.22) 0 1px,transparent 1px 14px),repeating-linear-gradient(-45deg,rgba(216,176,104,.22) 0 1px,transparent 1px 14px)}
.price{font:600 22px "Cormorant Garamond",Georgia,serif}
.mute{color:var(--mute);font-size:14px}
.stars{color:var(--star);letter-spacing:1px}
.btn{padding:10px 18px;border-radius:2px;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);font-weight:400;letter-spacing:.06em}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:14px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:13px;border:1px solid var(--line)}
.chip.good{border-color:var(--acc);color:var(--acc)}.chip.bad{border-color:var(--warn);color:var(--warn)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surf);color:var(--ink);width:min(680px,94vw);max-height:90vh;padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.f{display:grid;gap:10px}.f label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.review{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:4px}
.review b{font-size:14px;color:var(--mute);font-weight:700}
.meter{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;font-size:14px}
.meter i{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i span{display:block;height:100%;background:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.scroll{overflow-x:auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:50}
.banner{padding:24px 16px}
.banner img{-webkit-mask-image:radial-gradient(ellipse at center,#000 62%,transparent 80%);mask-image:radial-gradient(ellipse at center,#000 62%,transparent 80%)}
dialog{border:1px solid #d8b068;border-top:4px solid #d8b068;border-radius:2px}
.meter i span{background:var(--star)}
.card{cursor:pointer;transition:border-color .15s,transform .15s}
.card:hover{transform:translateY(-2px)}
button:disabled{opacity:.5;cursor:not-allowed}
::selection{background:#d8b068;color:#321b0c}
@media (max-width:520px){header{padding:12px 14px}.brand{font-size:22px}.meter{grid-template-columns:110px 1fr 34px}.banner img{width:min(240px,80%)}}
@media (max-width:520px){.tiles{grid-template-columns:repeat(3,1fr)}.tile{flex-direction:column;gap:4px;padding:12px 4px;font-size:16px;text-align:center}.tile span{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.banner .btn{background:#d8b068;color:#321b0c;border-color:#d8b068;margin-top:18px}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:12px 0 4px}
.trust div{background:var(--surf);padding:12px 14px;display:grid;gap:2px}
.trust b{font:600 18px "Cormorant Garamond",Georgia,serif}
.trust span{font-size:13px;color:var(--mute)}
.buy{margin-top:6px;padding:8px;text-align:center;background:var(--acc);color:var(--acc-ink);letter-spacing:.06em;font-size:14px}
.specs{display:grid;gap:8px;margin:14px 0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.specs div{display:grid;grid-template-columns:70px 1fr;gap:10px}
.specs b{font:600 18px "Cormorant Garamond",Georgia,serif}
.voices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
blockquote{margin:0;padding:16px;background:var(--surf);border:1px solid var(--line);border-top:3px solid #d8b068;display:grid;gap:6px}
blockquote p{margin:0}
cite{font-style:normal;font-size:13px;color:var(--mute)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,summary,select{touch-action:manipulation;-webkit-tap-highlight-color:rgba(216,176,104,.35)}
img{max-width:100%}
main{max-width:1180px}
@media (min-width:1100px){.grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.banner{padding:36px 24px}}
@media (min-width:600px) and (max-width:1000px){.tabs button{padding:10px 18px}}
@media (max-width:600px){
 main{padding:14px 12px}
 header{padding:10px 12px;gap:8px}
 .tabs{width:100%}.tabs button{flex:1;padding:10px 6px}
 .banner{padding:18px 12px}.banner img{width:min(210px,70%);margin-bottom:4px}
 .banner h1{font-size:28px}.banner p{font-size:15px;margin-top:10px}
 .trust{display:none}
 .tiles{gap:8px}
 .bar{gap:8px}.bar select{flex:1 1 100%;width:100%}
 h2#collection{font-size:24px!important;margin:14px 0 10px!important}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .card{padding:8px;gap:4px}
 .thumb{height:110px;font-size:40px;box-shadow:inset 0 0 0 3px #d8b068,inset 0 0 0 5px rgba(36,17,8,.55)}
 .card h3{font-size:17px}
 .card .mute{font-size:13px}
 .card .price{font-size:19px}
 .voices{grid-template-columns:1fr}
 dialog{width:100vw;max-width:100vw;max-height:92vh;margin:auto 0 0;border-radius:2px 2px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
 .meter{grid-template-columns:120px 1fr 34px}
 table{font-size:14px}td,th{padding:6px 4px}
}
@media (max-width:360px){.brand{font-size:20px}.tile{font-size:15px}}
</style>
</head>

function meters(p){
 if(!p.reviews.length)return "";
 return `<h3 style="font-size:17px;margin:14px 0 8px">How buyers rate the result</h3>`+OUT.map(([k,l])=>{const n=p.reviews.filter(r=>r.out===k).length;const pc=Math.round(n/p.reviews.length*100);
 return `<div class="meter"><span>${l}</span><i><span style="width:${pc}%"></span></i><span>${pc}%</span></div>`}).join("");
}

 ${specs(p)}${meters(p)}
 <h3 style="font-size:19px;margin:16px 0 0">Buyer reviews</h3>
 ${p.reviews.map(r=>`<div class="review"><div><span class="stars">${stars(r.stars)}</span> <b>${esc(r.who)}</b> ${r.ver?'<span class="chip good">Verified buyer</span>':""}</div>
 <div>${esc(r.text)}</div><div><b>How it wore for me:</b> ${esc(r.effect)}</div>
 <div><b>Outcome:</b> <span class="chip ${r.out==="neg"?"bad":r.out==="none"?"":"good"}">${label(r.out)}</span></div></div>`).join("")||`<p class="mute">Be the first to share what happened.</p>`}
 <details style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px"><summary style="cursor:pointer;font-weight:500">Bought this? Write a review</summary>
 <form class="f" id="rf" data-id="${p.id}" style="margin-top:10px">
 <label>Your name<input name="who" required maxlength="40" value="${ME}"></label>
 <label>Rating<select name="stars"><option value="5">5 - Excellent</option><option value="4">4 - Good</option><option value="3">3 - Okay</option><option value="2">2 - Poor</option><option value="1">1 - Bad</option></select></label>
 <label>Your review<textarea name="text" rows="2" required maxlength="400"></textarea></label>
 <label>How did it wear for you?<textarea name="effect" rows="2" required maxlength="400" placeholder="For example: fit, comfort, fabric feel, colour and shape after washing"></textarea></label>
 <label>Overall outcome<select name="out">${OUT.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join("")}</select></label>
 <button class="btn" type="submit">Post review</button></form></details>`;
 $("#dlg").showModal();
}
function orders(){
 return `<div class="hero"><h1>My orders</h1></div>`+(S.orders.length?`<div class="scroll"><table><tr><th>Item</th><th>Paid</th><th>Date</th><th></th></tr>${S.orders.map(o=>{const p=S.products.find(x=>x.id===o.pid);return `<tr><td>${p?esc(p.name):"Removed item"}</td><td>${inr(o.price)}</td><td>${o.date}</td><td>${p?`<button class="btn alt sm" data-open="${p.id}">Review</button>`:""}</td></tr>`}).join("")}</table></div>`:`<p class="mute">No orders yet. Find something in Shop and tap Buy now.</p>`);
}

document.addEventListener("click",e=>{
 const t=e.target.closest("[data-v],[data-open],[data-buy],[data-close],[data-cat],[data-go]");if(!t)return;
 const d=t.dataset;
 if(d.go){document.getElementById(d.go).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})}
 else if(d.cat!==undefined){cat=d.cat===cat?"":d.cat;render()}
 else if(d.v){view=d.v;render()}
 else if(d.open)detail(+d.open);
 else if(d.close)$("#dlg").close();
 else if(d.buy){const p=S.products.find(x=>x.id===+d.buy);S.orders.unshift({pid:p.id,price:p.price,date:new Date().toLocaleDateString("en-IN")});save();toast("Order placed. Demo only, no payment taken.");detail(p.id);}
});
document.addEventListener("input",e=>{
 if(e.target.id==="q"){q=e.target.value;const pos=e.target.selectionStart;render();const i=$("#q");i.focus();i.setSelectionRange(pos,pos)}
 if(e.target.id==="cat"){cat=e.target.value;render()}
});
document.addEventListener("submit",e=>{
 e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f));for(const k in v)v[k]=String(v[k]).trim();if(Object.values(v).some(x=>!x)){toast("Please fill in every field");return}
 if(f.id==="rf"){const p=S.products.find(x=>x.id===+f.dataset.id);
  p.reviews.unshift({who:v.who,stars:+v.stars,text:v.text,effect:v.effect,out:v.out,ver:S.orders.some(o=>o.pid===p.id)});save();toast("Review posted");detail(p.id)}
 });
$("#dlg").addEventListener("click",e=>{const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()});
render();
</script>
</body>
</html>
